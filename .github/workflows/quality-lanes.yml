name: Quality lanes

on:
  push:
    branches: [main]
    paths:
      - "rust/crates/zg-engine/**"
      - "rust/crates/zg-codegraph/**"
      - "rust/crates/zg-graph-projection/**"
      - "rust/Cargo.lock"
      - "rust/rust-toolchain.toml"
      - "src/engine/**"
      - "src/index.ts"
      - "src/index-progress.ts"
      - "benchmarks/quality-lanes/**"
      - ".github/workflows/quality-lanes.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "rust/crates/zg-engine/**"
      - "rust/crates/zg-codegraph/**"
      - "rust/crates/zg-graph-projection/**"
      - "rust/Cargo.lock"
      - "rust/rust-toolchain.toml"
      - "src/engine/**"
      - "src/index.ts"
      - "src/index-progress.ts"
      - "benchmarks/quality-lanes/**"
      - ".github/workflows/quality-lanes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: lane path filter
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      retrieval: ${{ steps.filter.outputs.retrieval }}
      graph: ${{ steps.filter.outputs.graph }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide which lanes the changed paths require
        id: filter
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.event.sha }}"
          fi
          # An unavailable endpoint (new branch, force push, manual
          # dispatch) runs both lanes.
          if ! git rev-parse --quiet --verify "$base^{commit}" >/dev/null 2>&1 \
             || ! git rev-parse --quiet --verify "$head^{commit}" >/dev/null 2>&1; then
            echo "retrieval=true" >> "$GITHUB_OUTPUT"
            echo "graph=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Diff against the merge base (three-dot semantics) so
            # base-only changes do not select lanes.
            base=$(git merge-base "$base" "$head") || {
              echo "retrieval=true" >> "$GITHUB_OUTPUT"
              echo "graph=true" >> "$GITHUB_OUTPUT"
              exit 0
            }
          fi
          changed=$(git diff --name-only "$base..$head")
          retrieval=false
          graph=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              rust/crates/zg-engine/*|src/engine/*|src/index.ts|src/index-progress.ts|benchmarks/quality-lanes/*|.github/workflows/quality-lanes.yml|rust/Cargo.lock|rust/rust-toolchain.toml)
                retrieval=true ;;
            esac
            case "$path" in
              rust/crates/zg-codegraph/*|rust/crates/zg-graph-projection/*|benchmarks/quality-lanes/*|.github/workflows/quality-lanes.yml|rust/Cargo.lock|rust/rust-toolchain.toml)
                graph=true ;;
            esac
          done <<< "$changed"
          echo "retrieval=$retrieval" >> "$GITHUB_OUTPUT"
          echo "graph=$graph" >> "$GITHUB_OUTPUT"

  retrieval-quality:
    name: retrieval quality (qeval, exact baselines)
    needs: changes
    if: needs.changes.outputs.retrieval == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-${{ runner.arch }}-quality-lanes-rust-v1-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-quality-lanes-rust-v1-
      - name: Build the zg CLI
        working-directory: rust
        run: cargo build --release --locked -p zg
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache the potion code model
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/model-cache
          key: quality-lanes-potion-code-16m-v2-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/engine/models/catalog.ts') }}
      - name: Verify fixture hashes against baselines.json
        run: python3 benchmarks/quality-lanes/check_fixture_hashes.py
      - name: Run the retrieval lane over both fixtures (2 reps each)
        run: |
          set -euo pipefail
          lanes=benchmarks/quality-lanes
          zg=rust/target/release/zg
          for fixture in go-workflow-discovery-v1 go-inventory-audit-v1; do
            for rep in 1 2; do
              python3 "$lanes/run_qeval.py" \
                --fixture "$lanes/fixtures/$fixture" \
                --binary "$zg" \
                --work-root "$RUNNER_TEMP/work-$fixture-rep$rep" \
                --output "$RUNNER_TEMP/results-$fixture-rep$rep" \
                --model-cache "$RUNNER_TEMP/model-cache"
              python3 "$lanes/check_baselines.py" \
                --baselines "$lanes/baselines.json" \
                --lane retrieval \
                --fixture "$fixture" \
                --results "$RUNNER_TEMP/results-$fixture-rep$rep/metrics-k10.json"
            done
            # The two reps must also be byte-identical to each other.
            cmp "$RUNNER_TEMP/results-$fixture-rep1/normalized-runs.json" \
               "$RUNNER_TEMP/results-$fixture-rep2/normalized-runs.json"
            echo "OK: $fixture retrieval reps are byte-identical"
          done

  # Equal-or-better per language and per metric. Each fixture run is compared
  # against its pinned floor in baselines-multilanguage.json; improvements pass
  # and are printed (re-pin them in a reviewed change), a regression fails.
  retrieval-quality-multilanguage:
    name: retrieval quality (4 languages, no regression)
    needs: changes
    if: needs.changes.outputs.retrieval == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-${{ runner.arch }}-quality-lanes-rust-v1-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-quality-lanes-rust-v1-
      - name: Build the zg CLI
        working-directory: rust
        run: cargo build --release --locked -p zg
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache the potion code model
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/model-cache
          key: quality-lanes-potion-code-16m-v2-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/engine/models/catalog.ts') }}
      - name: Run the lane's Python unit tests
        run: python3 -m unittest discover -s benchmarks/quality-lanes -p 'test_*.py'
      - name: Verify vendored lane assets
        run: python3 benchmarks/quality-lanes/check_fixture_hashes.py
      - name: Verify multi-language fixture snapshots
        run: python3 benchmarks/quality-lanes/check_multilanguage_fixtures.py
      - name: Run the four-language lane (2 repeats, frozen index)
        run: |
          set -euo pipefail
          lanes=benchmarks/quality-lanes
          zg=rust/target/release/zg
          summary="$RUNNER_TEMP/multilanguage-summary.jsonl"
          : > "$summary"
          for fixture in \
            go-workflow-discovery-v1 \
            python-workflow-discovery-v1 \
            rust-workflow-discovery-v1 \
            typescript-workflow-discovery-v1; do
            python3 "$lanes/run_qeval_multilanguage.py" \
              --fixture "$lanes/fixtures/$fixture" \
              --binary "$zg" \
              --work-root "$RUNNER_TEMP/work-ml-$fixture" \
              --output "$RUNNER_TEMP/results-ml-$fixture" \
              --model-cache "$RUNNER_TEMP/model-cache" \
              --repeats 2 | tee -a "$summary"
            python3 "$lanes/check_baselines_multilanguage.py" \
              --baselines "$lanes/baselines-multilanguage.json" \
              --fixture "$fixture" \
              --results "$RUNNER_TEMP/results-ml-$fixture/metrics.json"
          done
      - name: Publish the retrieval summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Multi-language retrieval (no regression)"
            echo
            python3 benchmarks/quality-lanes/summarize_multilanguage.py \
              "$RUNNER_TEMP/multilanguage-summary.jsonl"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload multi-language metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-lanes-multilanguage
          path: ${{ runner.temp }}/results-ml-*/metrics.json
          if-no-files-found: warn

  graph-quality:
    name: graph quality (codegraph vs compiler truth)
    needs: changes
    if: needs.changes.outputs.graph == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-${{ runner.arch }}-quality-lanes-rust-v1-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-quality-lanes-rust-v1-
      - name: Build the zg CLI
        working-directory: rust
        run: cargo build --release --locked -p zg
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify fixture hashes against baselines.json
        run: python3 benchmarks/quality-lanes/check_fixture_hashes.py
      - name: Run the graph lane over both fixtures
        run: |
          set -euo pipefail
          lanes=benchmarks/quality-lanes
          zg=rust/target/release/zg
          for fixture in go-workflow-discovery-v1 go-inventory-audit-v1; do
            python3 "$lanes/adjudicate_graph.py" \
              --fixture "$lanes/fixtures/$fixture" \
              --binary "$zg" \
              --work-root "$RUNNER_TEMP/work-$fixture" \
              --output "$RUNNER_TEMP/adjudication-$fixture.json"
            python3 "$lanes/check_baselines.py" \
              --baselines "$lanes/baselines.json" \
              --lane graph \
              --fixture "$fixture" \
              --results "$RUNNER_TEMP/adjudication-$fixture.json"
          done

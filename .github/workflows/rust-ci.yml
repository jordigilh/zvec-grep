name: Rust CI

on:
  push:
    branches: [main, dev/rust]
    paths:
      - "rust/**"
      - ".github/workflows/rust-ci.yml"
      - ".github/actions/**"
      - ".gitignore"
      - "!**/*.md"
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "rust/**"
      - ".github/workflows/rust-ci.yml"
      - ".github/actions/**"
      - ".gitignore"
      - "!**/*.md"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          node --input-type=module --eval
          "const title = process.env.PR_TITLE ?? '';
          const valid = /^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([^)]+\))?!?: .+/.test(title);
          if (!valid) { console.error('PR title must use Conventional Commits syntax'); process.exit(1); }"
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-${{ runner.arch }}-rust-cargo-v1-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-cargo-v1-
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check packages independently
        shell: bash
        run: |
          for package in zg-engine zg-codegraph zg-daemon-protocol zg-cli zg-host-native zg-testkit zg-transport-mcp zg-daemon zg zg-zvec-fp16; do
            cargo check --locked --package "${package}" --all-targets
          done
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Validate Cargo metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

  test:
    name: rust test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-${{ runner.arch }}-rust-cargo-v1-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-cargo-v1-
      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets
      - name: Smoke test the CLI
        run: cargo run --locked -p zg -- --rg "zvec-grep Rust rewrite" README.md

  # Opt-in Apple-GPU backend (issue #74). One lane, on macOS: mlx-sys 0.7 links
  # Apple frameworks unconditionally (-lobjc, -framework Foundation), so the
  # feature cannot link on Linux even with MLX's CPU backend. Non-GPU logic is
  # covered here by the unit tests, which pin the CPU device.
  mlx:
    name: rust mlx (macos)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # The metallib path is compiled into libmlx. Keeping it inside the cached
      # target dir means a restored cache still finds the file, instead of a
      # build-script fingerprint that is fresh while $HOME lost the metallib.
      MLX_RS_METAL_PATH: ${{ github.workspace }}/rust/target/mlx-metallib
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Ensure the Metal toolchain
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version
      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-${{ runner.arch }}-rust-mlx-v1-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-mlx-v1-
      - name: Check the opt-in MLX feature
        run: cargo clippy --locked -p zg-engine --all-targets --features mlx -- -D warnings
      - name: Verify the MLX metallib exists
        run: test -f "$MLX_RS_METAL_PATH/mlx.metallib"
      - name: Test the opt-in MLX feature
        run: cargo test --locked -p zg-engine --lib --features mlx
      - name: Restore the MLX model cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/zvec-grep-mlx
          key: mlx-jina-516f4ba-v1
      - name: Metal numerics and parity gates
        # The filter matches both ignored gates: `cached_jina_mlx` replays the
        # committed fp32 ONNX references, and `cached_jina_mlx_gpu_matches_cpu`
        # compares Metal against CPU. Both assert a real Metal device, so a
        # silent CPU fallback fails the lane. `~` is expanded here; GitHub
        # Actions does not expand it in a step-level `env` value.
        run: |
          export ZVEC_GREP_TEST_MODEL_CACHE="$HOME/.cache/zvec-grep-mlx"
          cargo test --locked -p zg-engine --lib --features mlx -- --ignored --nocapture cached_jina_mlx

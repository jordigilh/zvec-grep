name: Publish Rust zg container

on:
  pull_request:
    paths:
      - "rust/**"
      - "container/zg-loopback-proxy/**"
      - ".github/workflows/publish-container.yml"
  push:
    branches: [main]
    tags: ["zg-v*"]
    paths:
      - "rust/**"
      - "container/zg-loopback-proxy/**"
      - ".github/workflows/publish-container.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Push the multi-architecture image to Quay
        required: true
        default: true
        type: boolean
      image_tag:
        description: Optional additional image tag, for example edge or 0.0.1
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: quay.io/jordigilh/zvec-grep
  PROXY_IMAGE_NAME: quay.io/jordigilh/zg-loopback-proxy

jobs:
  container:
    name: Build multi-architecture image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Compute image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./rust
          file: ./rust/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            RUST_VERSION=1.98.0
            UBI_VERSION=10.2
            ZIG_VERSION=0.15.2
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=zg-container
          cache-to: type=gha,mode=max,scope=zg-container
          provenance: mode=max
          sbom: true

      - name: Compute proxy image metadata
        id: proxy-metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PROXY_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}

      - name: Ensure proxy repository exists
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          set -euo pipefail
          repo_url="https://quay.io/api/v1/repository/jordigilh/zg-loopback-proxy"
          response_file="$RUNNER_TEMP/zg-loopback-proxy-repository.json"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${QUAY_TOKEN}" \
            "$repo_url")"
          if [[ "$status" == 200 ]]; then
            echo "Quay repository already exists: jordigilh/zg-loopback-proxy"
            exit 0
          fi
          if [[ "$status" != 404 ]]; then
            cat "$response_file" >&2
            echo "Unexpected Quay repository lookup status: $status" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${QUAY_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"namespace":"jordigilh","repository":"zg-loopback-proxy","visibility":"public","description":"Loopback TCP bridge for the zvec-grep container"}' \
            'https://quay.io/api/v1/repository'

      - name: Build and publish loopback proxy
        uses: docker/build-push-action@v6
        with:
          context: ./container/zg-loopback-proxy
          file: ./container/zg-loopback-proxy/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
          tags: ${{ steps.proxy-metadata.outputs.tags }}
          labels: ${{ steps.proxy-metadata.outputs.labels }}
          cache-from: type=gha,scope=zg-loopback-proxy
          cache-to: type=gha,mode=max,scope=zg-loopback-proxy
          provenance: mode=max
          sbom: true

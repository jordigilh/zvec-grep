name: Publish Rust zg container

on:
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/publish-container.yml"
  push:
    branches: [main]
    tags: ["zg-v*"]
    paths:
      - "rust/**"
      - ".github/workflows/publish-container.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Push the multi-architecture image to Quay
        required: true
        default: true
        type: boolean
      image_tag:
        description: Optional additional image tag, for example edge or 0.0.1
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: quay.io/jordigilh/zvec-grep

jobs:
  container:
    name: Build multi-architecture image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Compute image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./rust
          file: ./rust/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            RUST_VERSION=1.98.0
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=zg-container
          cache-to: type=gha,mode=max,scope=zg-container
          provenance: mode=max
          sbom: true

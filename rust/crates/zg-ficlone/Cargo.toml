[package]
name = "zg-ficlone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Linux reflink (FICLONE) copy for seeding workspace indexes"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Copied from the workspace so this crate can allow the one ioctl call below.
# `rustix` exposes no FICLONE wrapper in the pinned version, and the standard
# library has none, so seeding a worktree copy-on-write on XFS/btrfs/ZFS needs
# the raw ioctl. Every other crate keeps the workspace `unsafe_code =
# "forbid"`, the same quarantine pattern as `zg-ort-version`.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
